name: Bug Report
description: Report a reproducible problem with the MBSE lab tooling.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private model data, runtime databases, or unredacted diagnostics.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: List the commands or workflow that reproduces the issue.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Docker version, Python version, and relevant command output.
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted Diagnostics
      description: Paste only redacted snippets that are needed to understand the problem.
      render: text
