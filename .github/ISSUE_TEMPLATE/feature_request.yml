name: Feature Request
description: Suggest a focused improvement to the MBSE lab tooling.
title: "Feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or usability gap should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the behavior you want.
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: Why is this feature worth doing for this repo, and which roadmap theme does it support?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Note any simpler or existing workflows that might solve the same problem.
  - type: textarea
    id: non_goals
    attributes:
      label: Non-Goals
      description: What should this feature explicitly not do?
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: List the observable outcomes required before this feature is done.
      placeholder: |
        - ...
        - ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Which checks, evals, docs builds, live smoke runs, or manual demos should prove the change?
      placeholder: |
        - make check
        - make docs-build
    validations:
      required: true
  - type: textarea
    id: data_safety
    attributes:
      label: Data And Credential Safety
      description: Note any private model data, generated artifacts, credentials, diagnostics, backups, reports, or share-check impact.
    validations:
      required: true
  - type: dropdown
    id: release_target
    attributes:
      label: Release Target
      description: Tentative planning target. Use Unassigned if the release is not decided yet.
      options:
        - Unassigned
        - v0.2.1 candidate
        - v0.3.0 candidate
        - v0.4.0 candidate
        - v0.5.0 candidate
        - v0.6.0 candidate
        - Later
    validations:
      required: true
  - type: dropdown
    id: preplan
    attributes:
      label: Pre-Planning Needed
      description: Use a proposal for roadmap-changing, risky, or multi-chunk feature work.
      options:
        - "No, focused issue is enough"
        - "Yes, create docs/plans/proposals/<feature>.md"
        - "Already linked"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Flexo deployment
        - SysON deployment
        - Flexo/SysON bridge
        - Documentation
        - Diagnostics
        - Other
    validations:
      required: true
