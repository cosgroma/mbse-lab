name: Feature Request
description: Suggest a focused improvement to the MBSE lab tooling.
title: "Feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or usability gap should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the behavior you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Note any simpler or existing workflows that might solve the same problem.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Flexo deployment
        - SysON deployment
        - Flexo/SysON bridge
        - Documentation
        - Diagnostics
        - Other
    validations:
      required: true
