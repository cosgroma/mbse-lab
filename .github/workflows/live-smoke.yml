name: Live smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: live-smoke-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MBSE_MODEL_WORKSPACE: ${{ github.workspace }}/.live-smoke-models
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install hatch
          python -m pip install -e .

      - name: Initialize lab files
        run: mbse-lab init --model-workspace "$MBSE_MODEL_WORKSPACE" --no-workspace-git

      - name: Start Flexo containers
        run: python3 scripts/flexo_mms_env.py up --wait --timeout 180

      - name: Initialize Flexo SysML v2 org
        run: |
          sleep 20
          for attempt in {1..12}; do
            if mbse-lab flexo init-org --timeout 60; then
              exit 0
            fi
            python3 scripts/flexo_mms_env.py status --with-sysmlv2 || true
            sleep 5
          done
          exit 1

      - name: Start SysON and wait for service APIs
        run: |
          mbse-lab services up --no-flexo --syson --timeout 180
          mbse-lab flexo list --timeout 60

      - name: Run first-use smoke
        run: mbse-lab smoke first-use --json-output --timeout 180

      - name: Verify deployment contract
        run: mbse-lab deployment verify --timeout 60

      - name: Run live evals
        run: make live-eval

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          mbse-lab diagnostics --public-safe --output diagnostics/live-smoke --timeout 30 --log-tail 80 || true

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: live-smoke-diagnostics
          path: diagnostics/live-smoke
          if-no-files-found: ignore

      - name: Stop services
        if: always()
        run: mbse-lab services down || true
