services:
  openldap-server:
    image: bitnamilegacy/openldap:2.6.4
    hostname: openldap-server
    environment:
      - LDAP_PORT_NUMBER=1389
      - LDAP_ROOT=dc=example,dc=org
      - LDAP_ADMIN_USERNAME=admin
      - LDAP_ADMIN_PASSWORD=${FLEXO_MMS_LDAP_ADMIN_PASSWORD}
      - LDAP_USERS=user01,user02
      - LDAP_USER_DC=users
      - LDAP_GROUP=group01
      - LDAP_PASSWORDS=${FLEXO_MMS_LDAP_USER01_PASSWORD},${FLEXO_MMS_LDAP_USER02_PASSWORD}

  quad-store-server:
    image: atomgraph/fuseki:4.6
    hostname: quad-server
    env_file:
      - ./env/flexo-mms-quad-store.env
    command: --file=/tmp/mount/cluster.nq --update /ds
    volumes:
      - "${FLEXO_MMS_MOUNT_DIR:-./mount}:/tmp/mount"
    ports:
      - "127.0.0.1:${FLEXO_MMS_FUSEKI_HOST_PORT}:3030"
    networks:
      default:
        aliases:
          - quad-server

  minio-server:
    image: quay.io/minio/minio
    hostname: minio-server
    environment:
      - MINIO_ROOT_USER=${FLEXO_MMS_MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${FLEXO_MMS_MINIO_ROOT_PASSWORD}
    command: server /data
    volumes:
      - "${FLEXO_MMS_DATA_DIR:-../../tmp/isolated-compose/flexo}/minio:/data"
    ports:
      - "127.0.0.1:${FLEXO_MMS_MINIO_HOST_PORT}:9000"

  auth-service:
    image: openmbee/flexo-mms-auth-service:latest
    hostname: auth-service
    env_file:
      - ./env/flexo-mms-jwt.env
      - ./env/flexo-mms-auth.env
    depends_on:
      - openldap-server
      - quad-store-server
    ports:
      - "127.0.0.1:${FLEXO_MMS_AUTH_HOST_PORT}:8080"

  store-service:
    image: openmbee/flexo-mms-store-service:v0.2.0
    hostname: store-service
    env_file:
      - ./env/flexo-mms-jwt.env
      - ./env/flexo-mms-store.env
    environment:
      - AWS_ACCESS_KEY_ID=${FLEXO_MMS_MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${FLEXO_MMS_MINIO_ROOT_PASSWORD}
    depends_on:
      - minio-server
    ports:
      - "127.0.0.1:${FLEXO_MMS_STORE_HOST_PORT}:8080"

  layer1-service:
    image: openmbee/flexo-mms-layer1-service:v0.2.2
    hostname: layer1-service
    env_file:
      - ./env/flexo-mms-jwt.env
      - ./env/flexo-mms-layer1.env
    depends_on:
      - store-service
      - auth-service
      - quad-store-server
    ports:
      - "127.0.0.1:${FLEXO_MMS_LAYER1_HOST_PORT}:8080"

  sysmlv2-service:
    image: openmbee/flexo-sysmlv2:v0.1.1
    hostname: flexo-sysmlv2
    env_file:
      - ./env/flexo-sysmlv2.env
    depends_on:
      - layer1-service
    ports:
      - "127.0.0.1:${FLEXO_MMS_SYSMLV2_HOST_PORT}:8080"
