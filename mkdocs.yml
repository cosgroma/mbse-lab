site_name: SysML v2 Local Lab
site_description: Shareable SysML v2 local lab kit for Flexo MMS, SysON, bridge workflows, private model workspaces, and publishable examples.
repo_name: mbse
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.follow

plugins:
  - search
  - mermaid2
  - include-markdown
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
  - glightbox

nav:
  - Home: index.md
  - Roadmap: roadmap.md
  - User Guide:
      - Private Model Workspaces: user-guide/private-model-workspaces.md
      - CLI: user-guide/cli.md
      - CLI Reference: user-guide/cli-reference.md
      - Services: user-guide/services.md
      - Safety And Sharing: user-guide/safety-and-sharing.md
      - Troubleshooting: user-guide/troubleshooting.md
      - Release Process: user-guide/release-process.md
      - v0.2.0 Limitations: user-guide/v0.2.0-limitations.md
  - Local Lab:
      - Bridge Workflow: lab/flexo-syson-bridge.md
      - Harness Engineering: lab/harness-engineering.md
      - Feature Development Agent Prompt: lab/feature-development-agent-prompt.md
      - Modeling Conventions: lab/modeling-conventions.md
      - View Editor Flexo Experiment: lab/view-editor-flexo-experiment.md
  - Methodology:
      - Verification Model Setup: methodology/sysml-v2-verification-model-setup.md
      - Transformation Pipeline: methodology/sysml-v2-transformation-pipeline-design.md
  - Model Specs:
      - MBSE Lab Tool System: model-specs/mbse-lab-tool-system.md
      - RF Link Budget: model-specs/rf-link-budget.md
      - CCA Rollup: model-specs/cca-rollup.md
      - RF to Digital Signal Chain: model-specs/rf-to-digital-signal-chain.md
      - Container Deployment: model-specs/container-deployment.md
      - Security Architecture: model-specs/security-architecture.md
      - Enterprise Architecture: model-specs/enterprise-architecture.md
  - Plans:
      - Overview: plans/README.md
      - Feature Proposals: plans/proposals/README.md
      - Feature Pre-Plan Template: plans/proposals/feature-preplan-template.md
      - Backup-First Reset Workflow: plans/proposals/backup-first-reset-workflow.md
      - Bridge Import Preflight: plans/proposals/bridge-import-preflight.md
      - Bridge Snapshot Diff: plans/proposals/bridge-snapshot-diff.md
      - Environment Profiles: plans/proposals/environment-profiles.md
      - Model-Like JSON Share Check: plans/proposals/model-like-json-share-check.md
      - Optional SysML v2 Starter Libraries: plans/proposals/optional-sysml-v2-starter-libraries.md
      - Polished HTML Report: plans/proposals/polished-html-report.md
      - Snapshot Evidence Bundle: plans/proposals/snapshot-evidence-bundle.md
      - SysML Coverage Matrix Gate: plans/proposals/sysml-coverage-matrix-gate.md
      - MVP Feature Catalog: plans/active/mvp-feature-catalog.md
      - Usability Remediation: plans/active/usability-remediation.md
      - SysML JSON Rendering Reuse Spike: plans/active/sysml-json-rendering-reuse-spike.md
      - View Editor Flexo Experiment: plans/completed/openmbee-view-editor-flexo-experiment.md
      - MBSE Lab SysML Model: plans/active/mbse-lab-sysml-model-plan.md
  - Reviews:
      - Usability Review: reviews/usability-review.md
      - Recommended Features Review: reviews/recommended-features.md
      - Recommended Sprint Sequence: reviews/recommended-sprints.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - tables
